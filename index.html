<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" id="theme-color-meta" />
  <title>VendiMap</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <style>
    :root, [data-theme="light"] {
      --bg: #f2f2f7;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-strong: rgba(255, 255, 255, 0.96);
      --surface-overlay: rgba(255, 255, 255, 1);
      --border: rgba(0, 0, 0, 0.08);
      --border-strong: rgba(0, 0, 0, 0.12);
      --text: #1d1d1f;
      --text-dim: #6e6e73;
      --accent: #007aff;
      --accent-strong: #0064d8;
      --vending: #ff453a;
      --pin-border: #fff;
      --pin-dim-bg: #c7c7cc;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      --tile-filter: none;
    }
    [data-theme="dark"] {
      --bg: #1c1c1e;
      --surface: rgba(44, 44, 46, 0.85);
      --surface-strong: rgba(58, 58, 60, 0.96);
      --surface-overlay: rgba(58, 58, 60, 1);
      --border: rgba(255, 255, 255, 0.1);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #f5f5f7;
      --text-dim: #a1a1a6;
      --accent: #0a84ff;
      --accent-strong: #0066cc;
      --vending: #ff6961;
      --pin-border: #f5f5f7;
      --pin-dim-bg: #48484a;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      --tile-filter: none;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", sans-serif;
      background: var(--bg); color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background 0.3s;
    }
    #map { height: 100vh; width: 100vw; background: var(--bg); }
    .leaflet-tile-pane { filter: var(--tile-filter); }
    .leaflet-control-zoom { display: none !important; }
    .leaflet-control-attribution {
      background: var(--surface) !important; color: var(--text-dim) !important;
      font-size: 10px !important;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      padding: 2px 8px !important; border-radius: 8px 0 0 0 !important;
    }
    .leaflet-control-attribution a { color: var(--text-dim) !important; }

    /* === ヘッダー === */
    .header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
      padding: max(env(safe-area-inset-top), 12px) 14px 12px;
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; pointer-events: none;
    }
    .brand {
      pointer-events: auto;
      display: flex; align-items: center; gap: 8px;
      background: var(--surface);
      backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
      padding: 8px 14px 8px 8px;
      border-radius: 999px;
      box-shadow: var(--shadow-sm);
      border: 0.5px solid var(--border);
    }
    .brand-mark {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--vending);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .brand-text { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
    .header-right { pointer-events: auto; display: flex; align-items: center; gap: 8px; }
    .pill {
      background: var(--surface);
      backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 0.5px solid var(--border);
      padding: 8px 14px; border-radius: 999px;
      font-size: 13px; color: var(--text); font-weight: 600;
      box-shadow: var(--shadow-sm);
    }
    .pill .count-num { color: var(--vending); }
    .icon-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--surface);
      backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 0.5px solid var(--border); color: var(--text);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 18px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.1s;
    }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
    }

    /* === シート === */
    .sheet-backdrop {
      position: fixed; inset: 0; z-index: 2000;
      background: rgba(0, 0, 0, 0.3);
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
    }
    .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 2001;
      background: var(--surface-overlay);
      border-radius: 20px 20px 0 0;
      padding: 8px 12px max(env(safe-area-inset-bottom), 20px);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      box-shadow: 0 -8px 32px rgba(0,0,0,0.15);
    }
    .sheet.show { transform: translateY(0); }
    .sheet-handle {
      width: 36px; height: 5px; border-radius: 999px;
      background: var(--border-strong);
      margin: 8px auto 12px;
    }
    .sheet-title {
      font-size: 17px; font-weight: 700; text-align: center;
      padding: 4px 0 12px; letter-spacing: -0.01em;
    }
    .theme-option {
      width: 100%;
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px;
      background: transparent; border: none;
      color: var(--text); font-size: 15px; font-weight: 500;
      text-align: left; cursor: pointer; border-radius: 12px;
      transition: background 0.15s;
    }
    .theme-option:active { background: var(--border); }
    .theme-option .opt-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .theme-option .opt-icon.auto { background: linear-gradient(135deg, #fff 50%, #1c1c1e 50%); color: transparent; }
    .theme-option .opt-icon.light { background: #fff; border: 0.5px solid var(--border-strong); }
    .theme-option .opt-icon.dark { background: #1c1c1e; }
    .theme-option .opt-label { flex: 1; }
    .theme-option .opt-check { color: var(--accent); font-size: 18px; opacity: 0; }
    .theme-option.active .opt-check { opacity: 1; }

    /* === コントロール === */
    .controls {
      position: absolute; bottom: max(env(safe-area-inset-bottom), 24px); left: 50%; transform: translateX(-50%);
      z-index: 1000; display: flex; gap: 8px;
    }
    .btn {
      background: var(--surface-strong);
      backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 0.5px solid var(--border);
      color: var(--text);
      padding: 13px 20px; border-radius: 999px;
      font-size: 15px; font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: transform 0.1s, background 0.15s;
      box-shadow: var(--shadow);
      letter-spacing: -0.01em;
    }
    .btn:active { transform: scale(0.96); }
    .btn-icon { font-size: 15px; }
    .btn-primary {
      background: var(--accent); color: #fff; border-color: transparent;
    }
    .btn-primary:active { background: var(--accent-strong); }

    /* === ステータス === */
    .status {
      position: absolute; top: 76px; left: 50%; transform: translateX(-50%) translateY(-10px);
      z-index: 1000;
      background: var(--surface-strong);
      backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 0.5px solid var(--border);
      color: var(--text);
      padding: 10px 18px; border-radius: 999px;
      font-size: 13px; font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: var(--shadow);
    }
    .status.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* === 現在地マーカー（コーン付き） === */
    .me-wrap {
      position: relative;
      width: 80px; height: 80px;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    /* 視野角コーン: 三角形を中心から上方向に伸ばす */
    .me-cone {
      position: absolute;
      top: 0; left: 50%;
      width: 80px; height: 40px;
      transform: translateX(-50%);
      transform-origin: 50% 100%;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .me-cone svg { width: 100%; height: 100%; display: block; }
    .me-wrap.has-heading .me-cone { opacity: 1; }
    .me-pulse {
      position: relative;
      width: 16px; height: 16px;
    }
    .me-pulse::before {
      content: '';
      position: absolute; inset: -6px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.25;
      animation: mePulse 2.5s infinite ease-out;
    }
    .me-pulse::after {
      content: '';
      position: absolute; inset: 0;
      border-radius: 50%;
      background: var(--accent);
      border: 3px solid var(--pin-border);
      box-shadow: 0 0 0 0.5px rgba(0,0,0,0.1), 0 2px 6px rgba(0,0,0,0.25);
    }
    @keyframes mePulse { 0%{transform:scale(0.6);opacity:0.9} 100%{transform:scale(2.5);opacity:0} }

    /* === 自販機ピン === */
    .vm-pin {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--vending);
      border: 2.5px solid var(--pin-border);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; line-height: 1;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    .vm-pin.dim {
      background: var(--pin-dim-bg);
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }

    /* === ポップアップ === */
    .leaflet-popup-content-wrapper {
      background: var(--surface-strong) !important;
      backdrop-filter: blur(20px);
      color: var(--text) !important;
      border-radius: 16px !important;
      border: 0.5px solid var(--border);
      box-shadow: var(--shadow) !important;
      padding: 4px !important;
    }
    .leaflet-popup-content { margin: 12px 14px 10px !important; font-size: 13px; color: var(--text) !important; min-width: 180px; }
    .leaflet-popup-tip { background: var(--surface-strong) !important; }
    .leaflet-popup-close-button { color: var(--text-dim) !important; padding: 6px 6px 0 0 !important; }
    .popup-title {
      font-weight: 700; font-size: 15px; margin-bottom: 6px;
      letter-spacing: -0.01em; color: var(--text);
    }
    .popup-row { color: var(--text-dim); font-size: 12px; margin-top: 3px; }
    .popup-row strong { color: var(--text); font-weight: 600; }
    .popup-nav-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%;
      margin-top: 10px;
      padding: 10px 14px;
      background: var(--accent);
      color: #fff;
      border: none; border-radius: 10px;
      font-size: 14px; font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      letter-spacing: -0.01em;
      -webkit-tap-highlight-color: transparent;
    }
    .popup-nav-btn:active { background: var(--accent-strong); }

    /* === ローディング === */
    .loading {
      position: absolute; inset: 0; z-index: 500;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text-dim); font-size: 14px;
      gap: 10px; font-weight: 500;
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-mark">🥤</div>
      <div class="brand-text">VendiMap</div>
    </div>
    <div class="header-right">
      <div class="pill" id="count-pill">
        <span class="count-num" id="count">準備中</span>
      </div>
      <button class="icon-btn" id="btn-compass" aria-label="向きを表示">🧭</button>
      <button class="icon-btn" id="btn-theme" aria-label="テーマ切替">
        <span id="theme-icon">◐</span>
      </button>
    </div>
  </div>

  <div id="map">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span>地図を読込中…</span>
    </div>
  </div>

  <div class="status" id="status"></div>

  <div class="controls">
    <button class="btn" id="btn-locate">
      <span class="btn-icon">📍</span>
      <span>現在地</span>
    </button>
    <button class="btn btn-primary" id="btn-search">
      <span class="btn-icon">🔍</span>
      <span>この範囲で探す</span>
    </button>
  </div>

  <!-- テーマシート -->
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">外観</div>
    <button class="theme-option" data-theme-choice="auto">
      <div class="opt-icon auto">A</div>
      <div class="opt-label">端末の設定に合わせる</div>
      <div class="opt-check">✓</div>
    </button>
    <button class="theme-option" data-theme-choice="light">
      <div class="opt-icon light">☀️</div>
      <div class="opt-label">ライト</div>
      <div class="opt-check">✓</div>
    </button>
    <button class="theme-option" data-theme-choice="dark">
      <div class="opt-icon dark">🌙</div>
      <div class="opt-label">ダーク</div>
      <div class="opt-check">✓</div>
    </button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const countEl = document.getElementById('count');
    const loadingEl = document.getElementById('loading');
    const themeColorMeta = document.getElementById('theme-color-meta');
    const themeIconEl = document.getElementById('theme-icon');

    function showStatus(msg, ms = 2000) {
      statusEl.textContent = msg;
      statusEl.classList.add('show');
      if (ms > 0) setTimeout(() => statusEl.classList.remove('show'), ms);
    }

    // === テーマ管理 ===
    const THEME_KEY = 'vendimap-theme';
    const mediaDark = window.matchMedia('(prefers-color-scheme: dark)');
    let tileLayerLight, tileLayerDark, labelLayerLight, labelLayerDark;
    let mapRef = null;

    function getStoredTheme() { return localStorage.getItem(THEME_KEY) || 'auto'; }
    function resolveTheme(pref) {
      if (pref === 'auto') return mediaDark.matches ? 'dark' : 'light';
      return pref;
    }
    function applyTheme(pref) {
      const actual = resolveTheme(pref);
      document.documentElement.setAttribute('data-theme', actual);
      themeColorMeta.setAttribute('content', actual === 'dark' ? '#1c1c1e' : '#f2f2f7');
      themeIconEl.textContent = pref === 'auto' ? '◐' : (actual === 'dark' ? '🌙' : '☀️');

      if (mapRef && tileLayerLight && tileLayerDark) {
        if (actual === 'dark') {
          if (mapRef.hasLayer(tileLayerLight)) mapRef.removeLayer(tileLayerLight);
          if (labelLayerLight && mapRef.hasLayer(labelLayerLight)) mapRef.removeLayer(labelLayerLight);
          if (!mapRef.hasLayer(tileLayerDark)) tileLayerDark.addTo(mapRef);
          if (labelLayerDark && !mapRef.hasLayer(labelLayerDark)) labelLayerDark.addTo(mapRef);
        } else {
          if (mapRef.hasLayer(tileLayerDark)) mapRef.removeLayer(tileLayerDark);
          if (labelLayerDark && mapRef.hasLayer(labelLayerDark)) mapRef.removeLayer(labelLayerDark);
          if (!mapRef.hasLayer(tileLayerLight)) tileLayerLight.addTo(mapRef);
          if (labelLayerLight && !mapRef.hasLayer(labelLayerLight)) labelLayerLight.addTo(mapRef);
        }
      }

      document.querySelectorAll('.theme-option').forEach(opt => {
        opt.classList.toggle('active', opt.dataset.themeChoice === pref);
      });
    }
    function setTheme(pref) {
      localStorage.setItem(THEME_KEY, pref);
      applyTheme(pref);
    }
    mediaDark.addEventListener('change', () => {
      if (getStoredTheme() === 'auto') applyTheme('auto');
    });
    applyTheme(getStoredTheme());

    // シート
    const sheet = document.getElementById('sheet');
    const backdrop = document.getElementById('sheet-backdrop');
    function openSheet() { sheet.classList.add('show'); backdrop.classList.add('show'); }
    function closeSheet() { sheet.classList.remove('show'); backdrop.classList.remove('show'); }
    document.getElementById('btn-theme').addEventListener('click', openSheet);
    backdrop.addEventListener('click', closeSheet);
    document.querySelectorAll('.theme-option').forEach(opt => {
      opt.addEventListener('click', () => {
        setTheme(opt.dataset.themeChoice);
        setTimeout(closeSheet, 150);
      });
    });

    // === コンパス（向き） ===
    let currentHeading = null;        // 0-360 度
    let compassActive = false;
    let orientationHandler = null;
    const btnCompass = document.getElementById('btn-compass');

    function updateHeadingUI() {
      const wrap = document.querySelector('.me-wrap');
      if (!wrap) return;
      const cone = wrap.querySelector('.me-cone');
      if (currentHeading != null) {
        wrap.classList.add('has-heading');
        if (cone) cone.style.transform = `translateX(-50%) rotate(${currentHeading}deg)`;
      } else {
        wrap.classList.remove('has-heading');
      }
    }

    function handleOrientation(e) {
      // iOS: webkitCompassHeading (0=北、時計回り)
      // Android: alpha (0=北、反時計回りなので 360-alpha)
      let heading = null;
      if (typeof e.webkitCompassHeading === 'number') {
        heading = e.webkitCompassHeading;
      } else if (e.alpha != null) {
        heading = 360 - e.alpha;
      }
      if (heading != null) {
        currentHeading = heading;
        updateHeadingUI();
      }
    }

    async function startCompass() {
      // iOS 13+ は許可が必要
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const res = await DeviceOrientationEvent.requestPermission();
          if (res !== 'granted') {
            showStatus('向きセンサーの許可が必要です', 3000);
            return false;
          }
        } catch (err) {
          showStatus('向きセンサーが使えません', 3000);
          return false;
        }
      }
      orientationHandler = handleOrientation;
      window.addEventListener('deviceorientationabsolute', orientationHandler, true);
      window.addEventListener('deviceorientation', orientationHandler, true);
      return true;
    }
    function stopCompass() {
      if (orientationHandler) {
        window.removeEventListener('deviceorientationabsolute', orientationHandler, true);
        window.removeEventListener('deviceorientation', orientationHandler, true);
        orientationHandler = null;
      }
      currentHeading = null;
      updateHeadingUI();
    }

    btnCompass.addEventListener('click', async () => {
      if (compassActive) {
        stopCompass();
        compassActive = false;
        btnCompass.classList.remove('active');
        showStatus('向き表示をオフにしました');
      } else {
        const ok = await startCompass();
        if (ok) {
          compassActive = true;
          btnCompass.classList.add('active');
          showStatus('向き表示をオンにしました');
        }
      }
    });

    // === 現在地・ナビ用 ===
    let currentPos = null;  // {lat, lng}

    function openNavigation(lat, lng, name) {
      // iOS なら Apple Maps、それ以外は Google Maps の徒歩ルート
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const label = encodeURIComponent(name || '自動販売機');
      let url;
      if (isIOS) {
        // Apple Maps（dirflg=w で徒歩）
        const saddr = currentPos ? `${currentPos.lat},${currentPos.lng}` : 'Current Location';
        url = `https://maps.apple.com/?saddr=${encodeURIComponent(saddr)}&daddr=${lat},${lng}&dirflg=w&q=${label}`;
      } else {
        // Google Maps（徒歩）
        url = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking`;
      }
      window.open(url, '_blank');
    }

    function init() {
      if (typeof L === 'undefined') {
        loadingEl.innerHTML = '<span>地図ライブラリの読込に失敗しました</span>';
        countEl.textContent = 'エラー';
        return;
      }
      loadingEl.remove();

      mapRef = L.map('map', { zoomControl: false, attributionControl: true, maxZoom: 18 })
        .setView([35.6812, 139.7671], 16);

      tileLayerLight = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap © CARTO', subdomains: 'abcd', maxZoom: 18,
      });
      labelLayerLight = null;
      tileLayerDark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap © CARTO', subdomains: 'abcd', maxZoom: 18,
      });
      labelLayerDark = null;

      const actual = resolveTheme(getStoredTheme());
      if (actual === 'dark') {
        tileLayerDark.addTo(mapRef);
        if (labelLayerDark) labelLayerDark.addTo(mapRef);
      } else {
        tileLayerLight.addTo(mapRef);
        if (labelLayerLight) labelLayerLight.addTo(mapRef);
      }

      // 現在地ピンのHTML（コーン+ドット）
      const meHTML = `
        <div class="me-wrap">
          <div class="me-cone">
            <svg viewBox="0 0 80 40" preserveAspectRatio="none">
              <defs>
                <radialGradient id="coneGrad" cx="50%" cy="100%" r="100%">
                  <stop offset="0%" stop-color="#007aff" stop-opacity="0.55"/>
                  <stop offset="100%" stop-color="#007aff" stop-opacity="0"/>
                </radialGradient>
              </defs>
              <path d="M 40 40 L 5 5 Q 40 -5 75 5 Z" fill="url(#coneGrad)"/>
            </svg>
          </div>
          <div class="me-pulse"></div>
        </div>
      `;
      const meIcon = L.divIcon({
        className: '',
        html: meHTML,
        iconSize: [80, 80], iconAnchor: [40, 40],
      });
      let meMarker = null;
      const vendingMarkers = L.layerGroup().addTo(mapRef);
      let searchCircle = null;  // 半径1kmの検索範囲円
      const SEARCH_RADIUS_M = 1000;  // 半径1km

      function showSearchCircle(lat, lng) {
        if (searchCircle) searchCircle.remove();
        searchCircle = L.circle([lat, lng], {
          radius: SEARCH_RADIUS_M,
          color: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#007aff',
          weight: 1.5,
          opacity: 0.5,
          fillColor: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#007aff',
          fillOpacity: 0.05,
          interactive: false,
        }).addTo(mapRef);
      }

      function locate() {
        if (!navigator.geolocation) { showStatus('位置情報が使えません'); return; }
        showStatus('現在地を取得中…', 0);
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const { latitude, longitude } = pos.coords;
            currentPos = { lat: latitude, lng: longitude };
            if (meMarker) meMarker.remove();
            meMarker = L.marker([latitude, longitude], { icon: meIcon, zIndexOffset: 1000 }).addTo(mapRef);
            updateHeadingUI();
            // 半径1kmが画面に収まるズーム（15）にして移動
            mapRef.setView([latitude, longitude], 15);
            statusEl.classList.remove('show');
            searchVending(latitude, longitude);
          },
          (err) => { showStatus('現在地取得に失敗', 3000); countEl.textContent = '取得失敗'; }
        );
      }

      async function searchVending(lat, lng) {
        // 引数が無ければ地図中心から検索（「この範囲で探す」用）
        if (lat == null || lng == null) {
          const c = mapRef.getCenter();
          lat = c.lat; lng = c.lng;
        }
        // 検索範囲を視覚化
        showSearchCircle(lat, lng);

        // Overpassのaroundで半径1km検索
        const query = `[out:json][timeout:25];node["amenity"="vending_machine"](around:${SEARCH_RADIUS_M},${lat},${lng});out;`;
        showStatus('検索中…', 0);
        countEl.textContent = '検索中';
        try {
          const res = await fetch('https://overpass-api.de/api/interpreter', {
            method: 'POST',
            body: 'data=' + encodeURIComponent(query),
          });
          const data = await res.json();
          vendingMarkers.clearLayers();
          let drinkCount = 0;
          data.elements.forEach((el) => {
            const tags = el.tags || {};
            const type = tags.vending || 'unknown';
            const isDrink = ['drinks', 'sweets', 'food', 'coffee'].includes(type);
            if (isDrink) drinkCount++;
            const emoji = type === 'drinks' ? '🥤' : type === 'coffee' ? '☕' : type === 'sweets' ? '🍫' : type === 'food' ? '🍙' : type === 'cigarettes' ? '🚬' : type === 'parking_tickets' ? '🅿️' : '🏷️';
            const dimClass = isDrink ? '' : ' dim';
            const icon = L.divIcon({
              className: '',
              html: `<div class="vm-pin${dimClass}">${emoji}</div>`,
              iconSize: [30, 30], iconAnchor: [15, 15],
            });
            const marker = L.marker([el.lat, el.lon], { icon });
            const payments = Object.keys(tags).filter(k => k.startsWith('payment:') && tags[k] === 'yes').map(k => k.replace('payment:', ''));
            const typeLabel = { drinks: '飲み物', coffee: 'コーヒー', sweets: 'お菓子', food: '食品', cigarettes: 'タバコ', parking_tickets: '駐車券' }[type] || type;
            const name = tags.name || '自動販売機';
            const navId = `nav-${el.id}`;
            const popup = `
              <div class="popup-title">${emoji} ${name}</div>
              <div class="popup-row"><strong>種類</strong>: ${typeLabel}</div>
              ${tags.operator ? `<div class="popup-row"><strong>運営</strong>: ${tags.operator}</div>` : ''}
              ${payments.length ? `<div class="popup-row"><strong>支払</strong>: ${payments.join(', ')}</div>` : ''}
              <button class="popup-nav-btn" id="${navId}" data-lat="${el.lat}" data-lng="${el.lon}" data-name="${name.replace(/"/g, '&quot;')}">
                <span>🧭</span><span>ここへ移動</span>
              </button>
            `;
            marker.bindPopup(popup);
            marker.on('popupopen', () => {
              const btn = document.getElementById(navId);
              if (btn) {
                btn.addEventListener('click', () => {
                  openNavigation(parseFloat(btn.dataset.lat), parseFloat(btn.dataset.lng), btn.dataset.name);
                });
              }
            });
            vendingMarkers.addLayer(marker);
          });
          countEl.textContent = `${data.elements.length}件 · 飲食${drinkCount}`;
          showStatus(`半径1km内で${data.elements.length}件`);
        } catch (e) {
          showStatus('検索に失敗しました', 3000);
          countEl.textContent = '失敗';
        }
      }

      document.getElementById('btn-locate').addEventListener('click', locate);
      document.getElementById('btn-search').addEventListener('click', () => searchVending());

      locate();
    }

    if (typeof L !== 'undefined') { init(); } else { window.addEventListener('load', init); }
  </script>
</body>
</html>
